# 글 끝에 붙는 한 줄. 처음 본 사람에게 "이 계정이 뭘 올리는 곳인지" 알린다.
#
# 24건을 내는 동안 이런 줄이 한 번도 없었고, 그 기간 팔로워가 4명 늘었다.
# 조회는 나오는데 팔로우로 이어지지 않았다.
# 경대생(팔로워 6천)은 "궁금하면 경대생만 팔로우하고 따라와" 를 붙인다.
#
# **회전시키는 이유**: 매번 같은 문구를 붙이면 그게 또 기계 신호가 된다.
# 본문 6건이 전부 같은 틀이라 AI 로 읽혔던 문제를 여기서 반복하면 안 된다.
# 코드가 돌려가며 고르고, 최근에 쓴 것은 피한다(src/closer.py).
#
# 영업 문구를 넣지 않는다. 목표는 문의가 아니라 팔로우다.

방법론:
  # 10-19: 현장 목격·중개 경험을 내세우는 문장은 AI 가 쓴 글에 붙이면 서프로님이 하지 않은 일을
  # 했다고 말하는 셈이라 뺐다(서프로님: "내가 한 적 없는 것을 했다고 하지마"). 사실인 문장만 남긴다.
  - 양재역 라인 빌딩을 중개합니다.
  - 건물 볼 때 확인할 것들을 하나씩 정리합니다.
  - 건물 서류 보는 법을 모으고 있습니다.

질문:
  - 답글로 의견 남겨주시면 다음 글에 참고하겠습니다.
  - 다른 기준으로 보시는 분도 계실 겁니다.
  - 생각이 갈리는 지점이라 궁금합니다.

뉴스:
  - 서울 아파트 소식을 정리해 올리고 있습니다.
  - 양재역 라인에서 중개하며 보는 것들을 씁니다.

AI활용:
  # 10-19: 써 봤다·실제로 쓴다는 문장은 확인되지 않은 경험이라 뺐다
  - 중개 일에 AI 를 쓰는 방법을 정리하고 있습니다.
  - AI 로 건물 서류 정리하는 법을 모으고 있습니다.

임장기:
  - 임장 기록은 계속 올리겠습니다.
  - 다음 임장도 정리해서 남기겠습니다.
