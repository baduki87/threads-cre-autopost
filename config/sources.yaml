# 수집 대상 설정. 운영하면서 키워드/제외어를 계속 다듬는 것이 품질의 핵심.

use_molit: true          # 국토교통부 보도자료 RSS
recency_hours: 48        # 이 시간 안에 나온 것만 후보로 본다

# 네이버 뉴스 검색 키워드 — 상업용 부동산에 초점
keywords:
  - 상업용 부동산
  - 오피스 빌딩 매매
  - 오피스 공실률
  - 물류센터 거래
  - 리테일 상가 공실
  - 리츠 REITs 배당
  - 부동산 펀드 자산
  - 캡레이트 수익률
  - 대형 빌딩 거래

# 제목에 이 단어가 들어가면 버린다 (분양 홍보·광고성 기사 차단)
exclude_words:
  - 분양
  - 청약
  - 모델하우스
  - 견본주택
  - 임대문의
  - 특별공급
  - 로또
  - 무순위
