# 수집 대상 설정. 운영하면서 키워드/제외어를 계속 다듬는 것이 품질의 핵심.
#
# 이 계정은 서울 주거용 아파트(임장·재건축·정책)를 다룬다.
# 상업용 부동산은 주제가 아니다 — docs/account-analysis.md 참고.

use_molit: true          # 국토교통부 보도자료 RSS
recency_hours: 48        # 이 시간 안에 나온 것만 후보로 본다

# 언론사 RSS — 열쇠가 필요 없다.
# 네이버가 2026-07 검색 API 신규 신청을 막아 이쪽으로 대체했다.
# 한 곳이 죽어도 나머지는 계속 읽는다. 실제로 접속되는 것만 넣었다.
news_feeds:
  # 부동산 전용 (주력)
  - name: 매일경제
    url: https://www.mk.co.kr/rss/50300009/
  - name: 뉴시스
    url: https://newsis.com/RSS/economy.xml
    require_topic: true
  - name: 조선비즈
    url: https://biz.chosun.com/arc/outboundfeeds/rss/category/real_estate/?outputType=xml
  # 경제 전반 (부동산 외 기사도 섞이므로 제외어로 걸러진다)
  - name: 연합뉴스
    url: https://www.yna.co.kr/rss/economy.xml
    require_topic: true

# require_topic: true 인 피드는 아래 단어가 제목·요약에 하나라도 있어야 통과한다.
# 경제 전반 피드에 네팔 수색·대만 외환보유액 같은 기사가 섞여 들어오기 때문이다.
topic_words:
  - 부동산
  - 아파트
  - 주택
  - 재건축
  - 재개발
  - 분양
  - 청약
  - 전세
  - 월세
  - 임대
  - 집값
  - 매매가
  - 실거래
  - 주담대
  - 주택담보
  - 국토부
  - 국토교통부
  - 정비사업
  - 조합
  - 용적률
  - 공시가격
  - 종부세
  - 취득세
  - 양도세
  - 토지거래허가

# 네이버 뉴스 검색 키워드 — 서울 아파트 투자 판단에 영향을 주는 것
keywords:
  - 주택담보대출 규제
  - 부동산 세제 개편
  - 재건축 사업시행인가
  - 재개발 조합 관리처분
  - 서울 아파트 거래량
  - 강남 아파트 신고가
  - 청약 제도 개편
  - 토지거래허가구역
  - 아파트 공급 물량
  - 전세 시장 동향

# 제목에 이 단어가 들어가면 버린다 (광고·홍보성 기사 차단)
# 청약·분양은 이 계정 주제라 더 이상 제외하지 않는다. 대신 홍보 문구만 거른다.
exclude_words:
  # 광고·홍보성
  - 모델하우스
  - 견본주택
  - 임대문의
  - 로또
  - 마감임박
  - 선착순
  - 초대박
  - 무료상담
  # 경제 전반 피드에서 섞여 들어오는 잡음
  - 부고
  - 인사
  - 동정
  - 별세
  - 포토
  - 사진
  - 코스피
  - 코스닥
  - 환율
  - 비트코인
  - 주가
