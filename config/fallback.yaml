# 메모도 없고 쓸 만한 뉴스도 없는 날 쓰는 백업 콘텐츠 풀.
# 억지로 낮은 품질을 발행하는 것보다 이쪽이 계정에 낫다.
#
# 하루 3건이면 5개짜리 풀은 이틀에 한 바퀴를 돌아 금방 뻔해진다.
# select.pick_fallback() 이 최근 쓴 주제와 같은 배치에서 쓴 주제를 피한다.
#
# 경쟁 계정 분석 결과 '방법론(How-to)'이 임장기보다 10배 강했고,
# 조회층 관심사 2위가 AI 였다. 그래서 그 둘을 두껍게 깔았다.
# docs/competitor-analysis.md / docs/account-analysis.md 참고.

topics:
  # ---------- 방법론: 상위권을 먹는 유형 ----------
  - label: 임장준비
    category: 실무
    prompt: |
      임장 가기 전 30분 안에 끝내는 사전 조사 순서를 번호로 정리한다.
      제목에 "30분 만에" 처럼 시간을 넣는다.
  - label: 단지파악
    category: 실무
    prompt: |
      단지에 도착해서 10분 안에 분위기를 파악하는 방법을 단계로 쓴다.
      주차장, 게시판, 상가, 놀이터처럼 실제로 볼 곳을 짚는다.
  - label: 중개사대화
    category: 실무
    prompt: |
      중개사무소에서 무엇을 어떻게 물어야 진짜 정보를 얻는지 정리한다.
      질문 문장을 그대로 쓸 수 있게 제시한다.
  - label: 관리사무소
    category: 실무
    prompt: |
      관리사무소·관리소장에게 확인할 항목을 정리한다.
      장기수선충당금, 누수 이력, 엘리베이터 교체 시기 같은 실제 항목으로.
  - label: 시세조사
    category: 실무
    prompt: |
      실거래가와 호가 차이를 읽는 방법을 단계로 정리한다.
      어떤 거래를 걸러야 하는지(직거래, 증여성 거래 등)까지 짚는다.
  - label: 재건축판단
    category: 실무
    prompt: |
      재건축 단지의 사업성을 빠르게 가늠하는 방법을 정리한다.
      대지지분, 세대수, 용적률 여유 같은 확인 순서로.

  # ---------- 체크리스트 ----------
  - label: 매물확인
    category: 실무
    prompt: |
      집을 보러 갔을 때 반드시 확인할 항목을 3~4개로 압축한다.
      현장에서 놓치기 쉬운 것 위주로.
  - label: 계약전
    category: 실무
    prompt: |
      계약서를 쓰기 전에 확인할 서류와 항목을 정리한다.
      등기부등본에서 무엇을 봐야 하는지 구체적으로.
  - label: 하자점검
    category: 실무
    prompt: |
      입주 전 하자 점검에서 놓치기 쉬운 곳을 정리한다.
  - label: 대출점검
    category: 실무
    prompt: |
      대출 실행 전에 확인해야 할 조건을 정리한다.
      확정적인 금리나 한도 수치는 쓰지 않는다.

  # ---------- 용어 ----------
  - label: 정비용어
    category: 실무
    prompt: |
      재건축·재개발에서 헷갈리기 쉬운 용어 하나를 골라
      정의 → 왜 중요한지 → 실제 판단에 어떻게 쓰이는지 순으로 정리한다.
      (사업시행인가, 관리처분, 조합원분양가, 비례율 등)
  - label: 면적용어
    category: 실무
    prompt: |
      면적 관련 용어를 정리한다.
      전용·공용·계약면적, 대지지분이 실제로 무엇을 뜻하는지.
  - label: 세금용어
    category: 실무
    prompt: |
      부동산 세금 용어 하나를 골라 정리한다.
      확정적인 세율 수치는 바뀔 수 있으므로 개념 위주로 쓴다.

  # ---------- AI × 부동산 ----------
  #
  # 조회층 관심사 2위가 AI(64) 다. 부동산 74 다음이다.
  # 그런데 부동산 계정 중 이걸 제대로 하는 곳이 없다 — 경쟁이 비어 있다.
  #
  # 계정 주인이 실제로 하는 일이라 가짜가 아니다. 중개용 CRM 을 직접 만들어
  # 쓰고, 클로드로 홈페이지를 만들었고, 2016년 이세돌·알파고 4국 심판이었다.
  #
  # **판단이 아니라 방법**이라 자동화가 잘할 수 있는 몇 안 되는 영역이다.
  - label: AI시세
    category: AI
    prompt: |
      실거래 데이터를 AI 로 정리하는 방법을 단계별로 쓴다.
      실제로 넣을 프롬프트 문장을 그대로 제시한다.
  - label: AI임장메모
    category: AI
    prompt: |
      임장에서 적은 메모를 AI 로 정리해 다시 찾아볼 수 있는 기록으로
      만드는 방법을 단계로 쓴다.
  - label: AI문서
    category: AI
    prompt: |
      중개 업무에서 반복되는 문서 작업을 AI 로 줄이는 방법을 정리한다.
  - label: AI등기부
    category: AI
    prompt: |
      등기부등본에서 확인할 항목을 AI 에게 물어 빠뜨리지 않는 방법을 정리한다.
      **AI 의 판단을 그대로 믿지 말고 원본과 대조하라**는 경고를 반드시 넣는다.
  - label: AI계약서
    category: AI
    prompt: |
      계약서 특약을 AI 로 검토할 때의 순서를 정리한다.
      법률 자문이 아니라 빠진 항목을 찾는 용도임을 분명히 한다.
  - label: AI단지비교
    category: AI
    prompt: |
      단지 두 곳을 비교할 때 AI 에게 무엇을 어떤 순서로 묻는지 정리한다.
      시세 수치는 AI 가 틀리니 반드시 원출처로 확인하라고 쓴다.
  - label: AI프롬프트
    category: AI
    prompt: |
      부동산 관련 질문을 AI 에게 할 때 답이 달라지는 프롬프트 작성법을 정리한다.
      나쁜 질문과 좋은 질문을 짝지어 보여준다.
  - label: AI한계
    category: AI
    prompt: |
      부동산에서 AI 가 못하는 일을 정리한다.
      시세·법정 수치·현장 분위기처럼 틀리거나 아예 알 수 없는 영역을 짚는다.
  - label: AI업무자동화
    category: AI
    prompt: |
      중개사무소의 반복 업무 중 AI 로 줄일 수 있는 것을 정리한다.
      매물 정리, 고객 응대 문안, 일정 관리 같은 실제 업무 단위로.
  - label: AI도구
    category: AI
    prompt: |
      부동산 일에 쓸 만한 AI 도구를 용도별로 정리한다.
      특정 제품 홍보처럼 읽히지 않게 무엇에 쓰는지 위주로 쓴다.

  # ---------- 경험·관점 ----------
  - label: 오해
    category: 실무
    prompt: |
      부동산에서 흔히 오해하는 지점 하나를 짚고 왜 오해인지 정리한다.
      단정적인 시장 전망은 쓰지 않는다.
  - label: 실수
    category: 실무
    prompt: |
      초보가 자주 하는 실수 하나를 짚고 어떻게 피하는지 정리한다.
