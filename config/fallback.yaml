# 쓸 만한 뉴스가 없는 날 쓰는 백업 콘텐츠 풀.
# 억지로 낮은 품질을 발행하는 것보다 이쪽이 계정에 낫다.
# select.py 가 요일을 기준으로 하나를 고른다.

topics:
  - label: 용어
    prompt: |
      상업용 부동산 투자자가 알아야 할 핵심 용어 하나를 골라
      정의 → 왜 중요한지 → 실제 판단에 어떻게 쓰이는지 순으로 설명한다.
      (예: 캡레이트, NOI, 공실률, LTV, DSCR, 매도호가 스프레드)
  - label: 지표
    prompt: |
      최근 상업용 부동산 시장에서 투자자가 주기적으로 확인해야 할 지표 하나를 골라
      지금 어떤 흐름인지, 어떤 신호로 읽어야 하는지 정리한다.
      확실하지 않은 최신 수치는 단정하지 말고 흐름 위주로 쓴다.
  - label: 관점
    prompt: |
      상업용 부동산 투자에서 흔히 오해하는 지점 하나를 짚고,
      왜 그것이 오해인지 근거를 들어 정리한다.
  - label: 체크리스트
    prompt: |
      상업용 부동산 물건을 검토할 때 반드시 확인해야 할 항목을
      3~4개로 압축해 제시한다. 각 항목마다 왜 중요한지 한 줄을 붙인다.
