# 메모도 없고 쓸 만한 뉴스도 없는 날 쓰는 백업 콘텐츠 풀.
# 억지로 낮은 품질을 발행하는 것보다 이쪽이 계정에 낫다.
# select.py 가 요일을 기준으로 하나를 고른다.
#
# 경쟁 계정 분석 결과 '방법론(How-to)'이 임장기보다 10배 강했다.
# 그래서 백업 주제를 방법론·체크리스트 위주로 짰다.
# docs/competitor-analysis.md 참고.

topics:
  - label: 방법론
    prompt: |
      임장 갈 때 쓰는 실전 방법 하나를 번호 목록으로 정리한다.
      "30분 만에", "5단계로" 처럼 시간이나 단계 수를 제목에 넣는다.
      (예: 단지 분위기 빠르게 파악하는 법, 관리사무소에서 물어볼 것,
       매물 보기 전 확인할 것, 동·호수별 차이 읽는 법)
  - label: 체크리스트
    prompt: |
      아파트를 볼 때 반드시 확인해야 할 항목을 3~4개로 압축한다.
      각 항목마다 왜 중요한지 한 줄을 붙인다.
      실제로 현장에서 놓치기 쉬운 것 위주로 고른다.
  - label: 용어
    prompt: |
      서울 아파트 투자자가 헷갈리기 쉬운 용어 하나를 골라
      정의 → 왜 중요한지 → 실제 판단에 어떻게 쓰이는지 순으로 짧게 정리한다.
      (예: 사업시행인가, 관리처분, 대지지분, 용적률, 조합원 분양가)
  - label: AI활용
    prompt: |
      부동산 일에 AI 를 쓰는 구체적인 방법 하나를 단계별로 정리한다.
      추상적인 이야기가 아니라 오늘 바로 따라 할 수 있는 순서로 쓴다.
      (조회층 관심사 2위가 AI 다 — docs/account-analysis.md)
  - label: 경험
    prompt: |
      부동산 투자나 중개 현장에서 흔히 오해하는 지점 하나를 짚고,
      왜 그것이 오해인지 정리한다. 단정적인 전망은 쓰지 않는다.
