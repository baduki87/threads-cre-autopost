# 메모도 없고 쓸 만한 뉴스도 없는 날 쓰는 백업 콘텐츠 풀.
# 억지로 낮은 품질을 발행하는 것보다 이쪽이 계정에 낫다.
#
# 하루 3건이면 5개짜리 풀은 이틀에 한 바퀴를 돌아 금방 뻔해진다.
# select.pick_fallback() 이 최근 쓴 주제와 같은 배치에서 쓴 주제를 피한다.
#
# 경쟁 계정 분석 결과 '방법론(How-to)'이 임장기보다 10배 강했고,
# 조회층 관심사 2위가 AI 였다. 그래서 그 둘을 두껍게 깔았다.
# docs/competitor-analysis.md / docs/account-analysis.md 참고.
#
# **2026-10-12 빌딩으로 전환.** 서프로님이 주거 파밍은 거의 안 하고 양재역 가는 라인의
# 빌딩 위주로 파밍 조사 중이라 주제 전체를 빌딩(꼬마빌딩·상가건물)으로 바꿨다.
# 이전 주거 주제는 git 이력에 있다.
#
# 빌딩 글은 틀리면 더 위험하다. 용적률·건폐율은 지역 조례마다 다르고, 세율·대출 비율은
# 자주 바뀐다. 그래서 모든 주제가 **개념과 확인 방법**만 쓰고 수치는 쓰지 않는다.
# 확인처는 실제로 있는 곳만 쓴다: 토지이음, 세움터, 정부24, 인터넷등기소, 일사편리.

topics:
  # ---------- 방법론: 빌딩 실무 ----------
  - label: 건물사전조사
    category: 실무
    prompt: |
      건물을 보러 가기 전 30분 안에 끝내는 사전 조사 순서를 번호로 정리한다.
      건축물대장, 토지이음(용도지역), 등기부등본에서 각각 무엇을 보는지.
      제목에 "30분 만에" 처럼 시간을 넣는다. 수치는 쓰지 않는다.
  - label: 건물외관
    category: 실무
    prompt: |
      건물 앞에 도착해서 10분 안에 볼 것을 단계로 쓴다.
      외벽 균열, 옥상 방수 흔적, 1층 가시성, 엘리베이터 유무, 주차 진입로처럼
      실제로 눈으로 볼 곳을 짚는다.
  - label: 1층상가보기
    category: 실무
    prompt: |
      건물 1층 상가를 현장에서 보는 방법을 정리한다.
      업종, 간판 상태, 영업시간, 지나가는 사람 흐름처럼 눈으로 확인할 것 위주로.
      임대료 수준이나 상권 전망은 쓰지 않는다.
  - label: 공실확인
    category: 실무
    prompt: |
      건물의 공실을 현장에서 확인하는 방법을 정리한다.
      우편함, 층별 안내판, 임대 현수막, 저녁에 불 켜진 층처럼 실제로 볼 수 있는 단서로.
  - label: 대장읽기
    category: 실무
    prompt: |
      건축물대장에서 확인할 항목을 정리한다.
      주용도, 층별 용도, 사용승인일, 주차대수, 위반건축물 표시가 각각 무엇을 뜻하는지.
      발급처(세움터·정부24)를 함께 쓴다.
  - label: 위반건축물
    category: 실무
    prompt: |
      건축물대장의 위반건축물 표시가 무엇이고 왜 매수 전에 확인하는지 정리한다.
      이행강제금 같은 개념은 설명하되 금액이나 비율은 쓰지 않는다.
  - label: 용도지역
    category: 실무
    prompt: |
      용도지역이 건물에 어떤 의미인지 개념으로 정리한다.
      건폐율·용적률 수치는 지역 조례마다 달라 쓰지 않고,
      토지이음에서 직접 확인하는 방법을 단계로 쓴다.
  - label: 임대차현황표
    category: 실무
    prompt: |
      건물 매수를 검토할 때 받는 임대차 현황표(렌트롤)에서 확인할 항목을 정리한다.
      보증금, 월세, 계약 만기, 관리비, 연체 여부를 무엇과 대조해야 하는지.
  - label: 수익률계산법
    category: 실무
    prompt: |
      건물 수익률을 계산하는 순서를 정리한다. 계산 방법만 쓴다.
      시장 수익률이 몇 퍼센트라는 식의 수준은 절대 쓰지 않는다.
      예시 숫자를 쓰면 "계산을 보여주기 위한 가상 숫자" 라고 밝힌다.
  - label: 건물주질문
    category: 실무
    prompt: |
      매수 검토 중 건물주(매도인)에게 확인할 질문 목록을 정리한다.
      관리 이력, 임차인 상황, 수리 내역처럼 서류로 안 나오는 것 위주로.
      질문 문장을 그대로 쓸 수 있게 제시한다.
  - label: 임차인승계
    category: 실무
    prompt: |
      건물을 살 때 기존 상가 임차인 계약을 넘겨받기 전 확인할 것을 정리한다.
      계약서 원본, 특약, 분쟁 여부. 법 해석이나 판단은 쓰지 않고
      "전문가 확인이 필요한 지점" 으로만 짚는다.
  - label: 주차진입로
    category: 실무
    prompt: |
      빌딩의 주차와 진입로를 현장에서 확인하는 방법을 정리한다.
      도로 폭, 진입 방향, 건축물대장의 주차대수와 실제 비교.
  - label: 노후설비
    category: 실무
    prompt: |
      오래된 건물에서 확인할 설비를 정리한다.
      엘리베이터 검사 이력, 소방 설비, 전기 용량, 누수 흔적. 수치 기준은 쓰지 않는다.
  - label: 건물대출점검
    category: 실무
    prompt: |
      건물 매입 대출 전에 확인해야 할 조건을 정리한다.
      확정적인 금리, 한도, 비율 수치는 쓰지 않는다. 무엇을 은행에 물어야 하는지 위주로.
  - label: 건물세금용어
    category: 실무
    prompt: |
      건물 거래에서 헷갈리는 세금 용어 하나를 골라 개념으로 정리한다.
      (건물분 부가가치세, 포괄양도양수 등) 세율은 쓰지 않는다.
      "세무사 확인이 필요하다" 를 반드시 넣는다.
  - label: 빌딩중개사대화
    category: 실무
    prompt: |
      빌딩 중개사무소에서 무엇을 어떻게 물어야 진짜 정보를 얻는지 정리한다.
      질문 문장을 그대로 쓸 수 있게 제시한다.
  - label: 첫건물실수
    category: 실무
    prompt: |
      처음 건물을 살 때 자주 하는 실수 하나를 짚고 어떻게 피하는지 정리한다.
      시장 전망은 쓰지 않는다.
  - label: 빌딩오해
    category: 실무
    prompt: |
      빌딩 투자에서 흔히 오해하는 지점 하나를 짚고 왜 오해인지 정리한다.
      단정적인 시장 전망은 쓰지 않는다.

  # ---------- AI × 빌딩 ----------
  #
  # 조회층 관심사 2위가 AI(64) 다. 부동산 계정 중 이걸 제대로 하는 곳이 없다.
  # 서프로님이 실제로 하는 일이라 가짜가 아니다 — 중개용 CRM 을 직접 만들어 쓰고,
  # 클로드로 지도에 매물이 연동되는 홈페이지를 만들었다.
  # **판단이 아니라 방법**이라 자동화가 잘할 수 있는 몇 안 되는 영역이다.
  - label: AI건축물대장
    category: AI
    prompt: |
      건축물대장을 AI 로 요약해 빠뜨린 항목을 찾는 방법을 단계로 쓴다.
      실제로 넣을 프롬프트 문장을 그대로 제시한다.
      **AI 의 요약을 그대로 믿지 말고 원본과 대조하라**는 경고를 반드시 넣는다.
  - label: AI렌트롤
    category: AI
    prompt: |
      임대차 현황표(렌트롤)를 AI 로 정리하는 방법을 쓴다.
      만기 순 정렬, 빈칸 찾기, 보증금·월세 합계 확인. 원본 대조 경고를 넣는다.
  - label: AI수익률표
    category: AI
    prompt: |
      AI 로 건물 수익률 계산표를 만드는 방법을 쓴다.
      AI 가 만든 계산식은 반드시 손으로 한 번 검산하라고 쓴다. 시장 수익률 수준은 쓰지 않는다.
  - label: AI건물임장메모
    category: AI
    prompt: |
      건물 임장에서 찍은 사진과 메모를 AI 로 정리해 다시 찾아볼 수 있는
      기록으로 만드는 방법을 단계로 쓴다.
  - label: AI매물장
    category: AI
    prompt: |
      건물 매물 목록을 AI 로 관리하는 방법을 정리한다.
      층별 임차 현황, 연락 이력, 다음 연락일처럼 중개사가 실제로 쓰는 항목으로.
  - label: AI안내문
    category: AI
    prompt: |
      건물주나 매수자에게 보낼 안내 문안 초안을 AI 로 만드는 방법을 쓴다.
      그대로 보내지 말고 사실관계를 직접 고쳐 쓰라고 분명히 한다. 영업 문구는 넣지 않는다.
  - label: AI빌딩등기부
    category: AI
    prompt: |
      건물 등기부등본에서 확인할 항목을 AI 에게 물어 빠뜨리지 않는 방법을 정리한다.
      **AI 의 판단을 그대로 믿지 말고 원본과 대조하라**는 경고를 반드시 넣는다.
  - label: AI빌딩질문법
    category: AI
    prompt: |
      빌딩 관련 질문을 AI 에게 할 때 답이 달라지는 프롬프트 작성법을 정리한다.
      나쁜 질문과 좋은 질문을 짝지어 보여준다.
  - label: AI빌딩한계
    category: AI
    prompt: |
      빌딩 일에서 AI 가 못하는 일을 정리한다.
      시세, 지역 조례 수치, 임차인 사정, 현장 분위기처럼 틀리거나 알 수 없는 영역을 짚는다.
  - label: AI지도
    category: AI
    prompt: |
      지도 위에 건물·공실 정보를 표시하는 도구를 AI 로 만드는 과정을 정리한다.
      특정 제품 홍보처럼 읽히지 않게 무엇에 쓰는지 위주로 쓴다.
