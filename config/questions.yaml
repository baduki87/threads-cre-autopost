# 질문 글 소재.
#
# 경쟁 계정에서 가장 강한 유형이다. 라바래빗 "현금 20억 있으면 어디 매수할
# 것 같오?" 가 좋아요 188 · 댓글 149. 좋아요보다 댓글이 많아지는 유일한 유형이고,
# 댓글이 곧 상담 유입이다.
#
# 자동화에 가장 잘 맞는 유형이기도 하다. **판단을 쓰지 않아도 되기 때문이다.**
# AI 가 묻기만 하고 답은 독자가 한다. 이 계정의 안전 규칙과 충돌하지 않는다.
#
# 지킬 것
#   - 둘 중 하나를 고르게 한다. 셋 이상이면 답이 흩어진다
#   - 계정 주인이 답을 내놓지 않는다. 물어만 본다
#   - 특정인에게 투자 권유로 읽히지 않게 일반적인 상황으로 묻는다
#   - 배경은 한두 줄. 기사 요약을 앞에 붙이면 질문이 죽는다

topics:
  # ---------- 양자택일: 지역·유형 ----------
  - label: 재건축vs신축
    prompt: |
      같은 예산이라면 강남권 재건축 구축과 마용성 신축 중 어디를 볼지 묻는다.
      각각의 성격만 한 줄씩 짚고 바로 묻는다.
  - label: 상급지갈아타기
    prompt: |
      1주택자가 상급지로 갈아탈 때, 지금 팔고 옮길지 전세를 끼고 먼저 살지 묻는다.
  - label: 학군vs교통
    prompt: |
      아이가 있는 집이 학군과 교통 중 무엇을 먼저 볼지 묻는다.
  - label: 한강뷰
    prompt: |
      한강뷰 프리미엄에 얼마까지 낼 수 있는지 묻는다.
      계정 주인은 금액을 제시하지 않는다.
  - label: 대단지vs소단지
    prompt: |
      대단지와 소단지 중 어느 쪽을 선호하는지, 이유와 함께 묻는다.
  - label: 신축vs준신축
    prompt: |
      입주 5년 이내 신축과 10년 전후 준신축 중 어디를 볼지 묻는다.

  # ---------- 상황 설정형 ----------
  - label: 현금생기면
    prompt: |
      지금 목돈이 생긴다면 어디를 보겠는지 묻는다.
      금액은 현실적인 범위로 하나만 제시한다.
  - label: 첫집
    prompt: |
      생애 첫 집을 고를 때 무엇을 가장 먼저 포기하는지 묻는다.
      (면적, 연식, 입지 중에서)
  - label: 전세vs매매
    prompt: |
      전세 만기가 왔을 때 갱신과 매수 중 어느 쪽을 택할지 묻는다.
  - label: 실거주vs투자
    prompt: |
      실거주와 투자 중 무엇을 우선하는지, 그 기준이 무엇인지 묻는다.

  # ---------- 경험·의견 ----------
  - label: 임장실수
    prompt: |
      임장 다니면서 가장 크게 후회한 판단이 무엇이었는지 묻는다.
      계정 주인의 경험은 쓰지 않는다. 메모가 없으면 지어내면 안 된다.
  - label: 중개사질문
    prompt: |
      중개사무소에서 가장 물어보기 어려웠던 질문이 무엇인지 묻는다.
  - label: 계약긴장
    prompt: |
      계약서에 도장 찍기 직전 가장 불안했던 항목이 무엇이었는지 묻는다.
  - label: 매도타이밍
    prompt: |
      집을 팔아야 할 때를 무엇으로 판단하는지 묻는다.

  # ---------- AI·도구: 조회층 관심사 2위 ----------
  - label: AI활용도
    prompt: |
      부동산 알아볼 때 AI 를 쓰는지, 쓴다면 어디에 쓰는지 묻는다.
  - label: 정보출처
    prompt: |
      단지 정보를 어디서 얻는지 묻는다.
      (임장, 커뮤니티, 유튜브, 중개사 중에서 하나)
