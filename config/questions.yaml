# 질문 글 소재. 2026-09-23 에 전면 교체했다.
#
# 그전에는 "대단지 vs 소단지", "재건축 vs 신축" 같은 추상적 양자택일이었다.
# 두 건 연속 좋아요 0 이었다(조회 188, 100).
#
# 실측으로 가장 잘 된 질문은 이것이다.
#   "중개사무소에서 질문이 막히는 순간" — 조회 651 · 좋아요 8 · 댓글 2
# 댓글을 단 두 사람이 모두 동종 공인중개사였다(@bundang.realty, @haeundaeyang).
#
# 왜 통했나.
#   1. 추상적 비교가 아니라 **겪어본 사람만 아는 구체적 상황**이다
#   2. **양쪽이 각자 자기 입장에서 답할 수 있다.**
#      소비자는 "물어보기 어려웠다", 중개사는 "이렇게 물어주시면 좋다"
#   3. 지식이 아니라 경험을 꺼내게 한다
#
# ## 이 파일을 고칠 때 지킬 것
#
#   - **현장의 한 순간을 집어낸다.** "무엇이 더 좋은가" 를 묻지 않는다
#   - **소비자와 중개사 양쪽이 답할 수 있어야 한다.** 한쪽만 답할 수 있으면
#     댓글이 한 줄로 끝난다
#   - 금액과 특정 지역·단지를 함께 묶지 않는다(시세 오류로 지적받은 적 있다)
#   - 계정 주인은 답을 내놓지 않는다. 묻기만 한다
#
# **2026-10-12 빌딩으로 전환.** 서프로님이 양재역 가는 라인의 빌딩 위주로 파밍 조사 중이다.
# 이전 주거 주제 26개는 git 이력에 있다.
#
# 빌딩 글의 독자도 둘이다 — **건물주·매수자** 와 **동종 중개사**. 상가 임차인이 셋째다.
# 특정 건물·주소는 쓰지 않는다(매물로 오해받는다).

topics:
  # ---------- 건물주와 중개사 사이 ----------
  - label: 건물주첫만남
    prompt: |
      중개사가 건물주를 처음 만나 대화를 여는 장면을 묻는다.
      중개사에게는 첫마디를, 건물주에게는 어떤 중개사가 편했는지를 묻는다.
  - label: 매각계기
    prompt: |
      건물을 팔기로 마음먹게 된 계기를 건물주에게 묻는다.
      중개사에게는 매각 상담에서 가장 자주 듣는 계기를 묻는다.
  - label: 건물주바람
    prompt: |
      건물주가 중개사에게 가장 바라는 것 하나를 묻는다.
      중개사에게는 반대로 건물주에게 가장 바라는 것을 묻는다.
  - label: 임대현수막
    prompt: |
      임대 현수막을 보고 직접 전화해 본 적이 있는지 묻는다.
      중개사·건물주에게는 현수막 전화가 실제 계약으로 이어지는지 묻는다.
  - label: 빌딩공동중개
    prompt: |
      빌딩 공동중개에서 가장 자주 어긋나는 지점을 중개사들에게 묻는다.

  # ---------- 건물을 고를 때 ----------
  - label: 건물첫눈
    prompt: |
      건물을 보러 갔을 때 가장 먼저 보는 곳 하나를 묻는다.
      매수자와 중개사가 각자 답하게 한다.
  - label: 첫건물망설임
    prompt: |
      첫 건물을 살 때 가장 오래 망설였던 항목을 묻는다.
  - label: 렌트롤첫줄
    prompt: |
      매수를 검토할 때 임대차 현황표에서 가장 먼저 보는 항목을 묻는다.
  - label: 주차결정
    prompt: |
      건물을 볼 때 주차 문제가 결정을 바꾼 적이 있는지 묻는다.
  - label: 낡은건물걱정
    prompt: |
      오래된 건물을 볼 때 가장 걱정되는 설비 하나를 묻는다.
  - label: 진짜매수자
    prompt: |
      건물 매수 문의 전화에서 진짜 매수자를 알아보는 첫 질문을 중개사에게 묻는다.
      매수자에게는 중개사에게 처음 물어보기 어려웠던 것을 묻는다.

  # ---------- 건물을 가진 뒤 ----------
  - label: 1층공실
    prompt: |
      1층이 오래 비어 있는 건물을 보면 무엇이 먼저 떠오르는지 묻는다.
      건물주에게는 1층 공실 때 가장 먼저 한 일을 묻는다.
  - label: 공실대응
    prompt: |
      공실이 생겼을 때 가장 먼저 한 일을 건물주에게 묻는다.
      중개사에게는 공실 상담에서 가장 많이 하는 이야기를 묻는다.
  - label: 건물관리
    prompt: |
      건물 관리에서 가장 손이 많이 가는 일을 건물주에게 묻는다.
  - label: 리모델링고민
    prompt: |
      건물(꼬마빌딩·상가건물) 리모델링을 고민해 본 적이 있는지, 했다면 무엇 때문에 했고
      안 했다면 무엇 때문에 안 했는지 묻는다. 아파트가 아니다.
  - label: 임차인연락
    prompt: |
      건물주에게 임차인에게서 받은 가장 곤란한 연락을 묻는다.
      임차인에게는 건물주에게 연락하기 가장 어려웠던 일을 묻는다.
  - label: 임차인바람
    prompt: |
      상가 임차인으로서 건물주에게 가장 바랐던 것 하나를 묻는다.
      건물주에게는 좋은 임차인의 조건 하나를 묻는다.
