# 질문 글 소재. 2026-09-23 에 전면 교체했다.
#
# 그전에는 "대단지 vs 소단지", "재건축 vs 신축" 같은 추상적 양자택일이었다.
# 두 건 연속 좋아요 0 이었다(조회 188, 100).
#
# 실측으로 가장 잘 된 질문은 이것이다.
#   "중개사무소에서 질문이 막히는 순간" — 조회 651 · 좋아요 8 · 댓글 2
# 댓글을 단 두 사람이 모두 동종 공인중개사였다(@bundang.realty, @haeundaeyang).
#
# 왜 통했나.
#   1. 추상적 비교가 아니라 **겪어본 사람만 아는 구체적 상황**이다
#   2. **양쪽이 각자 자기 입장에서 답할 수 있다.**
#      소비자는 "물어보기 어려웠다", 중개사는 "이렇게 물어주시면 좋다"
#   3. 지식이 아니라 경험을 꺼내게 한다
#
# ## 이 파일을 고칠 때 지킬 것
#
#   - **현장의 한 순간을 집어낸다.** "무엇이 더 좋은가" 를 묻지 않는다
#   - **소비자와 중개사 양쪽이 답할 수 있어야 한다.** 한쪽만 답할 수 있으면
#     댓글이 한 줄로 끝난다
#   - 금액과 특정 지역·단지를 함께 묶지 않는다(시세 오류로 지적받은 적 있다)
#   - 계정 주인은 답을 내놓지 않는다. 묻기만 한다

topics:
  # ---------- 중개사무소에서 벌어지는 일 ----------
  - label: 문열기
    prompt: |
      중개사무소 문을 처음 열고 들어갈 때의 어색함을 묻는다.
      손님은 뭐라고 말을 떼는지, 중개사는 어떤 손님이 편한지 양쪽에 묻는다.
  - label: 말못한것
    prompt: |
      중개사에게 끝내 말하지 못한 것이 있었는지 묻는다.
      예산, 대출 한도, 진짜 이유 같은 것. 중개사에게는 반대로
      손님이 숨겨서 곤란했던 적을 묻는다.
  - label: 전화문의
    prompt: |
      전화로 매물을 물을 때와 받을 때의 온도 차이를 묻는다.
      어떤 전화가 성의 있게 느껴지는지.
  - label: 보여주기
    prompt: |
      집을 보여주는 자리에서 곤란했던 순간을 묻는다.
      집주인이 있을 때, 세입자가 있을 때의 어색함.
  - label: 재방문
    prompt: |
      같은 집을 두 번째 보러 갈 때 무엇이 달라 보였는지 묻는다.
      중개사에게는 재방문하는 손님을 어떻게 보는지 묻는다.

  # ---------- 결정의 순간 ----------
  - label: 도장직전
    prompt: |
      계약서에 도장을 찍기 직전 가장 불안했던 항목을 묻는다.
  - label: 가격협상
    prompt: |
      가격을 깎아달라는 말을 꺼내는 순간을 묻는다.
      어떻게 말을 꺼냈는지, 중개사는 어떤 요청이 통한다고 보는지.
  - label: 마음바뀜
    prompt: |
      계약 직전에 마음이 바뀐 적이 있는지 묻는다.
      무엇 때문이었는지.
  - label: 놓친집
    prompt: |
      놓치고 나서 계속 생각나는 집이 있는지 묻는다.
      왜 그때 결정하지 못했는지.
  - label: 첫집후회
    prompt: |
      첫 집을 고를 때 가장 크게 놓친 것이 무엇이었는지 묻는다.

  # ---------- 임장 현장 ----------
  - label: 임장들킴
    prompt: |
      임장 중에 주민이나 중개사와 마주쳤을 때 어떻게 했는지 묻는다.
  - label: 발품한계
    prompt: |
      하루에 몇 군데까지 보면 판단이 흐려지는지 묻는다.
  - label: 첫인상
    prompt: |
      단지에 들어선 순간 마음이 정해진 적이 있는지 묻는다.
      무엇이 그렇게 만들었는지.

  # ---------- 중개사만 아는 일 ----------
  - label: 떠보기전화
    prompt: |
      시세를 떠보려는 전화를 어떻게 구분하는지 중개사들에게 묻는다.
      손님에게는 반대로 물어보기 미안했던 적이 있는지 묻는다.
  - label: 공동중개
    prompt: |
      공동중개가 잘 풀린 경우와 틀어진 경우의 차이를 묻는다.
  - label: 손님기억
    prompt: |
      오래 기억에 남는 손님이 있는지 묻는다.
      계약이 됐든 안 됐든.

  # ---------- 2026-10-08 추가 — 실제로 달린 댓글에서 뽑았다 ----------
  # 16개 중 최근 3주에 안 쓴 주제가 3개뿐이라 보충했다.
  # 주제마다 근거가 된 댓글을 적어둔다. 지어낸 주제가 아니다.
  # 제목에 '순간' 이 몰려서(11건 중 6건) 아래 prompt 에는 그 말을 쓰지 않았다.

  # 근거: 등기부 글 댓글 "며칠 전에 뗀 등기부만 보고 안심했다가 그 사이 근저당이…"
  - label: 등기부재발급
    prompt: |
      계약 당일에 등기부를 다시 떼어 보는지 묻는다.
      손님에게는 직접 확인해 본 적이 있는지, 중개사에게는 당일 재발급을
      손님 앞에서 하는지 묻는다.
  # 근거: 중개사 질문 글 댓글 "장단점 솔직히 알려달라시면 알려주고 싶어 안달이 납니다"
  - label: 단점묻기
    prompt: |
      집을 볼 때 중개사에게 그 집의 단점을 직접 물어본 적이 있는지 묻는다.
      중개사에게는 단점을 먼저 묻는 손님을 어떻게 보는지 묻는다.
  # 근거: 임장 글 댓글 "눈에 띌 정도로 행동하니까… 잘못된 임장 방식이 아닌가"
  - label: 임장예의
    prompt: |
      임장 다니는 사람이 단지 안에서 어디까지 둘러봐도 괜찮은지 묻는다.
      주민으로 살면서 불편했던 임장객이 있었는지도 함께 묻는다.
  # 근거: 시세 조사 글 댓글 "최근 3개월 실거래가로 한 번 더 크로스체크하는 습관"
  - label: 호가실거래
    prompt: |
      매물을 볼 때 호가와 실거래가 중 무엇을 먼저 확인하는지 묻는다.
      실거래가는 몇 달치까지 거슬러 보는지. 금액은 예로 들지 않는다.
  # 근거: 전세 만기 글 — 진짜 댓글 2건, 질문 글 중 상위
  - label: 갱신연락
    prompt: |
      전세 만기를 앞두고 집주인에게 갱신 이야기를 언제 꺼내는지 묻는다.
      먼저 연락하는 편인지, 연락이 오길 기다리는 편인지.
      중개사에게는 이 연락이 늦어서 꼬인 경우를 묻는다.
  # 근거: 계약 직전 글들(도장직전·마음바뀜)이 조회는 나왔지만 막연했다. 더 좁힌다
  - label: 가계약금
    prompt: |
      가계약금을 보내기 전에 마지막으로 무엇을 확인했는지 묻는다.
      중개사에게는 가계약이 깨지는 가장 흔한 이유를 묻는다.
  - label: 잔금날
    prompt: |
      잔금 치르고 이사하는 날 예상 못 한 일이 있었는지 묻는다.
      중개사에게는 잔금날 가장 자주 생기는 문제를 묻는다.
  - label: 입주하자
    prompt: |
      입주하고 나서 발견한 하자를 누구에게 먼저 연락했는지 묻는다.
      매도인, 중개사, 관리사무소 중. 중개사에게는 그런 연락을 받았을 때를 묻는다.
  # 근거: 정보출처 글 — 조회층이 앱과 현장 정보 차이에 관심
  - label: 앱과현장
    prompt: |
      앱에서 본 매물과 현장에서 본 실제가 가장 달랐던 점을 묻는다.
      중개사에게는 손님이 앱만 보고 와서 놀라는 점을 묻는다.
  - label: 가족반대
    prompt: |
      집을 정할 때 가족의 반대를 겪은 적이 있는지 묻는다.
      누가, 무엇 때문에. 중개사에게는 가족 반대로 계약이 멈춘 경우를 묻는다.
