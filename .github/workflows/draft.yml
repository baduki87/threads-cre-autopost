name: 저녁 초안 생성

# KST 19:00 = UTC 10:00. 초안을 만들어 노션에 '대기'로 올린다.
# 회원님이 노션에서 승인하면 밤 9시 발행 워크플로가 올린다.
on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "노션에 쓰지 않고 결과물만 생성"
        type: boolean
        default: true

concurrency:
  group: threads-pipeline
  cancel-in-progress: false

permissions:
  contents: write   # 카드 이미지를 커밋해야 공개 URL 이 생긴다

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 한글 폰트 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum

      - name: 의존성 설치
        run: pip install -q -r requirements.txt

      - name: 커밋 사용자 설정
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 초안 생성
        env:
          MODE: draft
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'auto' }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          THREADS_ACCOUNT_HANDLE: ${{ vars.THREADS_ACCOUNT_HANDLE }}
        run: python -m src.main

      - name: 결과물 업로드 (DRY_RUN 검증용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draft-output
          path: out/
          if-no-files-found: ignore
          retention-days: 14
