name: 밤 9시 발행

# 독자 활동 시간이 밤 21~24시라는 인사이트 데이터에 맞췄다.
# 노션에서 '승인'된 초안만 올린다. 승인이 없으면 아무것도 하지 않는다.
on:
  schedule:
    # KST 21:00 = UTC 12:00. Actions cron 은 UTC 기준이다.
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "실제로 발행하지 않고 확인만"
        type: boolean
        default: true

concurrency:
  group: threads-pipeline
  cancel-in-progress: false

permissions:
  contents: write   # 카드 이미지와 상태 파일을 커밋해야 한다

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: pip install -q -r requirements.txt

      - name: 커밋 사용자 설정
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 승인된 초안 발행
        env:
          MODE: publish
          # 수동 실행이면 입력값을, 스케줄 실행이면 0(=실제 발행)을 쓴다.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python -m src.main

